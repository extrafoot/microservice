server:
  port: ${GATEWAY_SERVICE_PORT}
  forward-headers-strategy: framework
  
spring:
  cloud:
    gateway:
      routes:
        - id: societe-service
          uri: lb://societe-service
          predicates:
            - Path=/societe-service/**
          filters:
            - RewritePath=/societe-service/(?<path>.*), /${path}

        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/client-service/**
          filters:
            - RewritePath=/client-service/(?<path>.*), /${path}

        # OpenAPI / Swagger route
        - id: openapi-societe
          uri: lb://societe-service
          predicates:
            - Path=/societe-service/v3/api-docs
          filters: []

        - id: openapi-client
          uri: lb://client-service
          predicates:
            - Path=/client-service/v3/api-docs
          filters: []
