server:
  port: ${GATEWAY_SERVICE_PORT:8083}  # Port du gateway par défaut 8083
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  output:
    ansi:
      enabled: always
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:

        # Route Societe Service
        - id: societe-service
          uri: lb://societe-service
          predicates:
            - Path=/societe-service/**
          filters:
            - RewritePath=/societe-service/(?<path>.*), /${path}

        # Route Client Service
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/client-service/**
          filters:
            - RewritePath=/client-service/(?<path>.*), /${path}

        # Routes OpenAPI / Swagger JSON via Gateway
        - id: openapi-societe
          uri: lb://societe-service
          predicates:
            - Path=/societe-service/v3/api-docs
          filters: []

        - id: openapi-client
          uri: lb://client-service
          predicates:
            - Path=/client-service/v3/api-docs
          filters: []

# Springdoc Swagger UI centralisé
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: societe-service
        url: /societe-service/v3/api-docs
      - name: client-service
        url: /client-service/v3/api-docs

# Logging utile pour debug Gateway
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
