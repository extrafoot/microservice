server:
  port: ${GATEWAY_SERVICE_PORT}

spring:
  cloud:
    gateway:
      routes:

        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/client-service/**
          filters:
            - RewritePath=/client-service/(?<segment>.*), /$\{segment}
            - AddRequestHeader=X-Forwarded-Prefix, /client-service
            - AddRequestHeader=X-Forwarded-Host, localhost:${GATEWAY_SERVICE_PORT}
            - AddRequestHeader=X-Forwarded-Proto, http   # <-- Important pour Swagger UI derrière proxy

        - id: societe-service
          uri: lb://societe-service
          predicates:
            - Path=/societe-service/swagger-ui/**, /societe-service/v3/api-docs/**, /societe-service/swagger-config/**
          filters:
            - AddRequestHeader=X-Forwarded-Prefix, /societe-service
            - AddRequestHeader=X-Forwarded-Host, localhost:${GATEWAY_SERVICE_PORT}
            - AddRequestHeader=X-Forwarded-Proto, http   # <-- Important pour Swagger UI derrière proxy
