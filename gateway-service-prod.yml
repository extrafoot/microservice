server:
  port: ${GATEWAY_SERVICE_PORT:8083}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:

        # ================================
        # CLIENT-SERVICE
        # ================================
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/client-service/**

        # ================================
        # SOCIETE-SERVICE
        # ================================
        - id: societe-service
          uri: lb://societe-service
          predicates:
            - Path=/societe-service/**

# ----------------------------
# Swagger / OpenAPI Gateway
# ----------------------------
springdoc:
  enable-native-support: true

  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Client Service
        url: /client-service/v3/api-docs
      - name: Societe Service
        url: /societe-service/v3/api-docs

  # Nécessaire pour Swagger derrière Gateway
  forward-headers-strategy: framework

# ----------------------------
# Actuator / Health
# ----------------------------
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    db:
      enabled: false   # Gateway n'a pas de DB
