server:
  port: ${GATEWAY_SERVICE_PORT}
springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway Service
        primaryName: API Gateway Service
      - url: /client-service/v3/api-docs
        name: Client Service
        primaryName: Client Service
      - url: /societe-service/v3/api-docs
        name: Societe Service
        primaryName: Societe Service
spring:
  cloud:
    gateway:
      routes:

        # ================================
        # CLIENT-SERVICE
        # ================================
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/client-service/** , /client-service/v3/api-docs
          filters:
            - StripPrefix=1

        # ================================
        # SOCIETE-SERVICE
        # ================================
        - id: societe-service
          uri: lb://societe-service
          predicates:
            - Path=/societe-service/** , /societe-service/v3/api-docs
          filters:
            - StripPrefix=1
