server:
  port: ${GATEWAY_SERVICE_PORT}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:

        # ================================
        # CLIENT-SERVICE
        # ================================
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/client-service/**
          filters:
            - StripPrefix=1

# ----------------------------
# Swagger / OpenAPI Gateway
# ----------------------------
springdoc:
  enable-native-support: true

  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Client Service
        url: /client-service/v3/api-docs
