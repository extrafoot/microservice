server:
  port: ${CLIENT_SERVICE_PORT}
  forward-headers-strategy: framework

spring:
  application:
    name: client-service
  datasource:
    url: ${SPRING_DATASOURCE_URL_CLIENT}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: client-service
        url: /v3/api-docs
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    db:
      enabled: true
