server:
  port: ${SOCIETE_SERVICE_PORT}
  
spring:
  application:
    name: societe-service
	
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
# ----------------------------
# Configuration de la base PostgreSQL
# ----------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dbsociete:5432/dbsociete}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ----------------------------
# Actuator pour health check
# ----------------------------
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    db:
      enabled: true
