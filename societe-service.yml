server:
  port: ${SOCIETE_SERVICE_PORT}
  forward-headers-strategy: framework
  
spring:
  application:
    name: societe-service
  datasource:
    url: ${SPRING_DATASOURCE_URL_SOCIETE}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  server:
    url: http://localhost:8083/societe-service
  swagger-ui:
    enabled: false
  
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    db:
      enabled: true
